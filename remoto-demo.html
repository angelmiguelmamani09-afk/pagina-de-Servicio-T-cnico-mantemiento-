<!-- Demo del Día 10 (fetch/jQuery). Ya no se muestra en la página.
     Para volver a usarlo: pega este bloque dentro de <main> en index.html
     y vuelve a agregar <script src="remoto.js" defer></script>. -->
      <!-- ── CATÁLOGO REMOTO: datos.json con fetch y jQuery (remoto.js) ────── -->
      <section id="remoto">
        <h2>Catálogo remoto</h2>
        <p class="intro">
          Estos productos no están escritos en la página: se piden al archivo <code>datos.json</code>
          cuando se pulsa un botón. Prueba la carga con <code>fetch</code>, con jQuery y también un error a propósito.
        </p>

        <div class="controles-remotos">
          <button id="cargar-fetch" class="boton" type="button">Cargar con fetch</button>
          <button id="cargar-jquery" class="boton" type="button">Cargar con jQuery</button>
          <button id="cargar-roto" class="boton boton-error" type="button">Probar un error</button>
        </div>

        <!-- Los tres estados: cargando, ok y error (remoto.js) -->
        <p id="estado" class="info" role="status" aria-live="polite">Pulsa un botón para cargar el catálogo.</p>

        <!-- Contenedor donde remoto.js dibuja las tarjetas -->
        <div id="lista-remota"></div>
      </section>
