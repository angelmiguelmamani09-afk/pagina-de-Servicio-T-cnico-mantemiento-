<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>Panel administrativo | TecnoFix</title><link rel="stylesheet" href="estilos.css"><link rel="stylesheet" href="premium-layer.css"><style>
.panel-wrap{max-width:1180px;margin:3rem auto;padding:0 1.25rem}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin:2rem 0}.panel-card{background:var(--superficie,white);border:1px solid var(--borde,#ddd);border-radius:18px;padding:1.25rem;box-shadow:0 8px 30px #10203a0c}.panel-card strong{display:block;font-size:2rem}.panel-table{width:100%;border-collapse:collapse}.panel-table th,.panel-table td{text-align:left;padding:.8rem;border-bottom:1px solid #ddd}.panel-login{max-width:420px;margin:4rem auto}.panel-login label{display:block;margin:.8rem 0 .3rem}.panel-login input{width:100%;padding:.8rem;border:1px solid #aaa;border-radius:9px}.panel-error{color:#b42318}.panel-muted{color:#667085}
</style></head><body><header class="topbar"><a class="marca" href="/"><span class="logo">TF</span><span>TecnoFix</span></a><div class="topbar-acciones"><a class="boton" href="/">Volver al sitio</a></div></header><main class="panel-wrap"><section id="login" class="panel-card panel-login"><h1>Acceso al sistema</h1><p class="panel-muted">Ingresa con tu cuenta de TecnoFix.</p><form id="login-form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="btn btn-primario" style="margin-top:1rem;width:100%">Iniciar sesión</button><p id="login-msg" role="alert"></p></form></section><section id="dashboard" hidden><div class="panel-head"><div><p class="hero-etiqueta">GESTIÓN INTERNA</p><h1>Panel de control</h1><p id="welcome" class="panel-muted"></p></div><button id="logout" class="boton">Cerrar sesión</button></div><div id="metrics" class="panel-grid"></div><section class="panel-card"><h2>Órdenes recientes</h2><div style="overflow:auto"><table class="panel-table"><thead><tr><th>Código</th><th>Cliente</th><th>Estado</th><th>Recepción</th></tr></thead><tbody id="orders"></tbody></table></div></section></section></main><script>
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const j=await r.json().catch(()=>({message:'Respuesta no válida'}));if(!r.ok||!j.success)throw new Error(j.message||'Error de comunicación');return j.data}
function showDashboard(user){$('#login').hidden=true;$('#dashboard').hidden=false;$('#welcome').textContent=`Sesión: ${user.nombre} · ${user.rol}`}
async function load(){const d=await api('/api/gestion/reportes/dashboard');const labels=[['Clientes',d.resumen.clientes],['Usuarios',d.resumen.usuarios],['Órdenes',d.resumen.ordenes],['Productos',d.resumen.productos],['Total cobrado',`Bs ${Number(d.resumen.totalCobrado).toFixed(2)}`],['Opiniones aprobadas',d.resumen.opinionesAprobadas]];$('#metrics').innerHTML=labels.map(([a,b])=>`<article class="panel-card"><span class="panel-muted">${a}</span><strong>${b}</strong></article>`).join('');$('#orders').innerHTML=d.ultimasOrdenes.map(o=>`<tr><td>${esc(o.codigo)}</td><td>${esc(o.cliente.nombres)} ${esc(o.cliente.apellidos)}</td><td>${esc(o.estado.replaceAll('_',' '))}</td><td>${new Date(o.fechaRecepcion).toLocaleDateString('es-BO')}</td></tr>`).join('')||'<tr><td colspan="4">No hay órdenes registradas.</td></tr>'}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-msg').textContent='';try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const me=await api('/api/auth/me');if(me.user.rol!=='ADMINISTRADOR')throw new Error('El panel está reservado al administrador.');showDashboard(me.user);await load()}catch(err){$('#login-msg').className='panel-error';$('#login-msg').textContent=err.message}});
$('#logout').addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{location.reload()}});
(async()=>{try{const me=await api('/api/auth/me');if(me.user.rol==='ADMINISTRADOR'){showDashboard(me.user);await load()}}catch{}})();
</script></body></html>
