<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b32"><title>Panel administrativo | TecnoFix</title>
<style>
:root{--navy:#101b32;--navy2:#172846;--blue:#3168f5;--ink:#18243a;--muted:#718096;--line:#e5eaf2;--bg:#f4f7fb;--white:#fff;--green:#12805c;--red:#c24141;--shadow:0 12px 35px #10203a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-size:20px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4b82ff,#1e4bc4);display:grid;place-items:center;font-size:14px}.nav-label{color:#8496b4;font-size:10px;letter-spacing:1.5px;font-weight:800;padding:0 12px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#c2cee0;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff17;color:white}.nav button .ico{width:20px;text-align:center}.side-foot{margin-top:auto;color:#9aabc4;font-size:12px;padding:8px}.main{min-width:0}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}.top small{color:var(--muted)}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:36px;height:36px;background:#e9efff;color:#2856ca;border-radius:50%;display:grid;place-items:center;font-weight:800}.content{max-width:1450px;margin:auto;padding:30px 32px 50px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.5px;margin:0 0 5px}.pagehead h1{font-size:28px;margin:0 0 5px;letter-spacing:-.7px}.muted{color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700}.primary{background:var(--blue);color:white}.primary:hover{background:#2455d8}.soft{background:#edf2ff;color:#2856ca}.danger{background:#fff0f0;color:var(--red)}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:20px}.metric .label{color:var(--muted);font-size:13px}.metric strong{display:block;font-size:30px;margin-top:5px;letter-spacing:-1px}.metric .hint{font-size:12px;color:var(--muted)}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:17px;margin:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{min-width:230px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#8190a5;background:#f9fbfd}td{font-size:13px}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf2ff;color:#3157bd;font-size:11px;font-weight:800}.tag.green{background:#e7f7ef;color:#14734e}.tag.orange{background:#fff4df;color:#9b6711}.tag.red{background:#fff0f0;color:#b43d3d}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{font-size:11px;padding:6px 9px;border-radius:7px}.empty{padding:35px;text-align:center;color:var(--muted)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);padding:32px}.login h1{margin:16px 0 5px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:700;color:#42516a}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #dce6ff;border-color:#7394f8}.msg{min-height:20px;color:var(--red);font-size:13px}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#0b1730a8;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 18px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#eef4ff;color:#3157a5;font-size:13px;margin-bottom:16px}.mobile-menu{display:none}
@media(max-width:1000px){.layout{grid-template-columns:210px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:24px 20px}}@media(max-width:720px){.layout{display:block}.sidebar{position:fixed;z-index:5;left:-270px;top:0;bottom:0;width:250px;transition:left .2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.top{padding:0 16px}.content{padding:20px 14px}.cards{gap:10px}.metric{padding:14px}.metric strong{font-size:24px}.pagehead{align-items:flex-start}.pagehead h1{font-size:23px}.search{min-width:100%;width:100%}.toolbar{width:100%}}
</style></head><body>
<section id="login-screen" class="login-wrap"><div class="login card"><div class="brand" style="color:#17243b;padding:0"><span class="logo">TF</span><span>TecnoFix Integral</span></div><h1>Acceso al sistema</h1><p class="muted">Ingresa con tu cuenta administrativa.</p><form id="login-form"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Iniciar sesión</button><p id="login-msg" class="msg" role="alert"></p></form></div></section>
<div id="app" class="layout hidden"><aside id="sidebar" class="sidebar"><div class="brand"><span class="logo">TF</span><span>TecnoFix</span></div><div class="nav-label">MENÚ PRINCIPAL</div><nav class="nav" id="nav"><button class="active" data-view="dashboard"><span class="ico">▦</span>Resumen</button><button data-view="clientes"><span class="ico">♙</span>Clientes</button><button data-view="equipos"><span class="ico">▣</span>Equipos</button><button data-view="solicitudes"><span class="ico">▤</span>Solicitudes</button><button data-view="ordenes"><span class="ico">⚙</span>Órdenes de trabajo</button><button data-view="usuarios"><span class="ico">♧</span>Personal y usuarios</button><button data-view="inventario"><span class="ico">▦</span>Inventario</button><button data-view="catalogo"><span class="ico">◇</span>Servicios y categorías</button></nav><div class="side-foot">Sistema integral de gestión<br>Servicio técnico y mantenimiento</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button id="menu-btn" class="btn outline mobile-menu">☰</button><div><strong>Panel administrativo</strong><br><small>Gestión interna de TecnoFix</small></div></div><div class="userbox"><div class="avatar">TF</div><div><strong id="user-name">Administrador</strong><br><small id="user-role">ADMINISTRADOR</small></div><button id="logout" class="btn outline">Salir</button></div></header><div class="content"><div id="view"></div></div></main></div>
<div id="modal-root"></div><div id="toast" style="position:fixed;right:20px;bottom:20px;z-index:20;display:none;background:#172846;color:white;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow)"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let currentUser=null,cache={clientes:[],equipos:[],tecnicos:[],ordenes:[],productos:[],categorias:[],servicios:[],solicitudes:[]};
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({message:'Respuesta no válida del servidor'}));if(!r.ok||!j.success)throw new Error(j.message||`Error ${r.status}`);return j.data}
const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data)}),patch=(url,data)=>api(url,{method:'PATCH',body:JSON.stringify(data)});function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}function money(n){return `Bs ${Number(n||0).toFixed(2)}`}function fmt(d){return d?new Date(d).toLocaleDateString('es-BO'):'—'}
function showApp(user){currentUser=user;$('#login-screen').classList.add('hidden');$('#app').classList.remove('hidden');$('#user-name').textContent=user.nombre;$('#user-role').textContent=user.rol;go('dashboard')}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-msg').textContent='';try{await post('/api/auth/login',{email:$('#email').value,password:$('#password').value});const me=await api('/api/auth/me');if(me.user.rol!=='ADMINISTRADOR')throw new Error('Este panel está reservado al administrador.');showApp(me.user)}catch(x){$('#login-msg').textContent=x.message}});
$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch{}location.reload()};$('#menu-btn').onclick=()=>$('#sidebar').classList.toggle('open');$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));$('#sidebar').classList.remove('open');go(b.dataset.view)});
function pageHead(title,sub,button=''){return `<div class="pagehead"><div><p class="eyebrow">TECNOFIX · GESTIÓN</p><h1>${title}</h1><div class="muted">${sub}</div></div>${button}</div>`}function table(headers,rows){return `<div class="panel table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No hay registros para mostrar.</td></tr>`}</tbody></table></div>`}
async function loadBase(){const [c,e,u,p,cat,o,s]=await Promise.all([api('/api/clientes?limit=100'),api('/api/equipos?limit=100'),api('/api/gestion/usuarios'),api('/api/gestion/productos'),api('/api/gestion/catalogo'),api('/api/ordenes?limit=100'),api('/api/solicitudes?limit=100')]);cache.clientes=c.clientes||[];cache.equipos=e.equipos||[];cache.tecnicos=(u.usuarios||[]).filter(x=>x.rol.nombre==='TECNICO'&&x.activo);cache.productos=p.productos||[];cache.categorias=cat.categorias||[];cache.servicios=cat.servicios||[];cache.ordenes=o.ordenes||[];cache.solicitudes=s.solicitudes||[];}
async function go(view){$('#view').innerHTML='<div class="panel">Cargando información…</div>';try{if(view==='dashboard')return await dashboard();await loadBase();if(view==='clientes')clientes();if(view==='equipos')equipos();if(view==='ordenes')ordenes();if(view==='solicitudes')solicitudes();if(view==='usuarios')usuarios();if(view==='inventario')inventario();if(view==='catalogo')catalogo()}catch(e){$('#view').innerHTML=`<div class="panel"><h2>No se pudo cargar esta sección</h2><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="go('${view}')">Reintentar</button></div>`}}
async function dashboard(){await loadBase();const d=await api('/api/gestion/reportes/dashboard');const r=d.resumen;$('#view').innerHTML=pageHead('Resumen general','Indicadores principales del taller')+`<div class="cards">${[['Clientes',r.clientes,'Registros de clientes'],['Usuarios',r.usuarios,'Cuentas del sistema'],['Órdenes',r.ordenes,'Órdenes de trabajo'],['Productos',r.productos,'Artículos en inventario'],['Total cobrado',money(r.totalCobrado),'Pagos registrados'],['Opiniones',r.opinionesAprobadas,'Opiniones aprobadas']].map(x=>`<article class="card metric"><div class="label">${x[0]}</div><strong>${x[1]}</strong><div class="hint">${x[2]}</div></article>`).join('')}</div><section class="panel"><div class="panel-head"><h2>Órdenes recientes</h2><button class="btn soft" onclick="go('ordenes')">Ver todas</button></div>${table(['Código','Cliente','Estado','Recepción'],(d.ultimasOrdenes||[]).map(o=>`<tr><td><b>${esc(o.codigo)}</b></td><td>${esc(o.cliente.nombres)} ${esc(o.cliente.apellidos)}</td><td><span class="tag">${esc(o.estado.replaceAll('_',' '))}</span></td><td>${fmt(o.fechaRecepcion)}</td></tr>`).join(''))}</section><section class="panel"><h2>Accesos rápidos</h2><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="newClient()">+ Registrar cliente</button><button class="btn soft" onclick="newEquipment()">+ Registrar equipo</button><button class="btn soft" onclick="newOrder()">+ Crear orden</button><button class="btn soft" onclick="go('inventario')">Gestionar inventario</button></div></section>`}
function clientes(){const rows=cache.clientes.map(c=>`<tr><td><b>${esc(c.nombres)} ${esc(c.apellidos)}</b></td><td>${esc(c.telefono)}</td><td>${esc(c.email||'—')}</td><td>${esc(c.direccion||'—')}</td><td><button class="btn mini soft" onclick="clientDetail('${c.id}')">Ver ficha</button></td></tr>`).join('');$('#view').innerHTML=pageHead('Clientes','Registra y consulta los clientes del taller',`<button class="btn primary" onclick="newClient()">+ Nuevo cliente</button>`)+`<div class="panel"><div class="toolbar"><input class="search" id="filter" placeholder="Buscar por nombre o teléfono…"><span class="muted">${cache.clientes.length} registros</span></div></div><div id="client-table">${table(['Cliente','Teléfono','Correo','Dirección','Acciones'],rows)}</div>`;$('#filter').oninput=e=>{const q=e.target.value.toLowerCase();$('#client-table').innerHTML=table(['Cliente','Teléfono','Correo','Dirección','Acciones'],cache.clientes.filter(c=>(c.nombres+' '+c.apellidos+' '+c.telefono).toLowerCase().includes(q)).map(c=>`<tr><td><b>${esc(c.nombres)} ${esc(c.apellidos)}</b></td><td>${esc(c.telefono)}</td><td>${esc(c.email||'—')}</td><td>${esc(c.direccion||'—')}</td><td><button class="btn mini soft" onclick="clientDetail('${c.id}')">Ver ficha</button></td></tr>`).join(''))}}
function equipos(){const rows=cache.equipos.map(e=>`<tr><td><b>${esc(e.tipo)} ${esc(e.marca)} ${esc(e.modelo||'')}</b><div class="muted">Serie: ${esc(e.numeroSerie||'—')}</div></td><td>${esc(e.cliente?.nombres||'')} ${esc(e.cliente?.apellidos||'')}</td><td>${fmt(e.creadoEn)}</td></tr>`).join('');$('#view').innerHTML=pageHead('Equipos','Equipos registrados y vinculados a sus propietarios',`<button class="btn primary" onclick="newEquipment()">+ Registrar equipo</button>`)+table(['Equipo','Cliente','Registro'],rows)}
const statusLabels={RECIBIDO:'Recibido',EN_DIAGNOSTICO:'En diagnóstico',PRESUPUESTO_PENDIENTE:'Presupuesto pendiente',PRESUPUESTO_APROBADO:'Presupuesto aprobado',EN_REPARACION:'En reparación',EN_PRUEBAS:'En pruebas',FINALIZADO:'Finalizado',LISTO_PARA_ENTREGA:'Listo para entrega',ENTREGADO:'Entregado',CANCELADO:'Cancelado'};
function ordenes(){const rows=cache.ordenes.map(o=>`<tr><td><b>${esc(o.codigo)}</b><div class="muted">${fmt(o.fechaRecepcion)}</div></td><td>${esc(o.cliente.nombres)} ${esc(o.cliente.apellidos)}<div class="muted">${esc(o.equipo.marca)} ${esc(o.equipo.modelo||o.equipo.tipo)}</div></td><td>${esc(o.tecnico?.nombre||'Sin asignar')}</td><td><span class="tag ${['ENTREGADO','FINALIZADO'].includes(o.estado)?'green':o.estado==='CANCELADO'?'red':'orange'}">${statusLabels[o.estado]||o.estado}</span></td><td><div class="actions"><button class="btn mini soft" onclick="orderDetail('${o.id}')">Gestionar</button><button class="btn mini outline" onclick="changeStatus('${o.id}')">Estado</button></div></td></tr>`).join('');$('#view').innerHTML=pageHead('Órdenes de trabajo','Controla recepción, diagnóstico, presupuesto, reparación y entrega',`<button class="btn primary" onclick="newOrder()">+ Nueva orden</button>`)+table(['Orden','Cliente / equipo','Técnico','Estado','Acciones'],rows)}
function solicitudes(){const rows=cache.solicitudes.map(s=>`<tr><td><b>${esc(s.codigo)}</b><div class="muted">${fmt(s.creadoEn)}</div></td><td>${esc(s.cliente.nombres)} ${esc(s.cliente.apellidos)}</td><td>${esc(s.equipoTipo||'No especificado')}</td><td>${esc(s.descripcion)}</td><td><span class="tag">${esc(s.estado)}</span></td><td>${s.estado==='CONVERTIDA'||s.estado==='RECHAZADA'?'—':`<button class="btn mini primary" onclick="convertRequest('${s.id}','${s.cliente.id}')">Crear orden</button> <button class="btn mini danger" onclick="rejectRequest('${s.id}')">Rechazar</button>`}</td></tr>`).join('');$('#view').innerHTML=pageHead('Solicitudes','Solicitudes de servicio recibidas de los clientes')+table(['Código','Cliente','Equipo','Descripción','Estado','Acciones'],rows)}
function usuarios(){const rows=[];api('/api/gestion/usuarios').then(d=>{const rr=(d.usuarios||[]).map(u=>`<tr><td><b>${esc(u.nombre)}</b></td><td>${esc(u.email)}</td><td>${esc(u.rol.nombre)}</td><td><span class="tag ${u.activo?'green':'red'}">${u.activo?'Activo':'Inactivo'}</span></td><td>${u.rol.nombre==='ADMINISTRADOR'?'—':`<button class="btn mini outline" onclick="toggleUser('${u.id}',${!u.activo})">${u.activo?'Desactivar':'Activar'}</button>`}</td></tr>`).join('');$('#users-table').innerHTML=table(['Nombre','Correo','Rol','Estado','Acciones'],rr)}).catch(e=>toast(e.message));$('#view').innerHTML=pageHead('Personal y usuarios','Administra las cuentas del equipo técnico',`<button class="btn primary" onclick="newTech()">+ Crear usuario</button>`)+`<div id="users-table">Cargando usuarios…</div>`}
function inventario(){const rows=cache.productos.map(p=>`<tr><td><b>${esc(p.nombre)}</b><div class="muted">SKU: ${esc(p.sku||'—')}</div></td><td>${esc(p.categoria?.nombre||'—')}</td><td>${money(p.precioVenta)}</td><td>${p.stock}</td><td>${p.stock<=p.stockMinimo?'<span class="tag red">Stock bajo</span>':'<span class="tag green">Disponible</span>'}</td><td><button class="btn mini soft" onclick="stockMove('${p.id}','${esc(p.nombre)}')">Movimiento</button></td></tr>`).join('');$('#view').innerHTML=pageHead('Inventario','Control de productos, existencias y movimientos',`<button class="btn primary" onclick="newProduct()">+ Nuevo producto</button>`)+table(['Producto','Categoría','Precio','Stock','Nivel','Acciones'],rows)}
function catalogo(){const rows=cache.servicios.map(s=>`<tr><td><b>${esc(s.nombre)}</b></td><td>${esc(s.categoria?.nombre||'—')}</td><td>${money(s.precio)}</td><td><span class="tag green">Activo</span></td></tr>`).join('');$('#view').innerHTML=pageHead('Servicios y categorías','Organiza el catálogo de servicios ofrecidos',`<div class="toolbar"><button class="btn outline" onclick="newCategory()">+ Categoría</button><button class="btn primary" onclick="newService()">+ Servicio</button></div>`)+table(['Servicio','Categoría','Precio','Estado'],rows)+`<section class="panel"><h2>Categorías registradas</h2><div class="toolbar" style="margin-top:12px">${cache.categorias.map(c=>`<span class="tag">${esc(c.nombre)}</span>`).join('')||'<span class="muted">No hay categorías.</span>'}</div></section>`}
function openForm(title,fields,submitText,handler){const root=$('#modal-root');root.innerHTML=`<div class="modal-back"><div class="modal"><h2>${title}</h2><form id="dynamic-form">${fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==='textarea'?`<textarea name="${f.name}" ${f.required?'required':''} placeholder="${f.placeholder||''}">${f.value||''}</textarea>`:f.type==='select'?`<select name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''}>`}</div>`).join('')}<p id="form-error" class="msg"></p><div class="modal-foot"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary">${submitText||'Guardar'}</button></div></form></div></div>`;$('#dynamic-form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());try{await handler(data);closeModal();toast('Operación realizada correctamente');const active=document.querySelector('#nav button.active')?.dataset.view||'dashboard';await go(active)}catch(x){$('#form-error').textContent=x.message}}}
function closeModal(){$('#modal-root').innerHTML=''}
function newClient(){openForm('Registrar cliente',[{name:'nombres',label:'Nombres',required:true},{name:'apellidos',label:'Apellidos',required:true},{name:'telefono',label:'Teléfono',required:true},{name:'email',label:'Correo electrónico',type:'email'},{name:'direccion',label:'Dirección'}],'Guardar cliente',d=>post('/api/clientes',d))}
function newEquipment(){const opts=cache.clientes.map(c=>({value:c.id,label:`${c.nombres} ${c.apellidos} · ${c.telefono}`}));if(!opts.length)return toast('Primero registra un cliente.');openForm('Registrar equipo',[{name:'clienteId',label:'Propietario',type:'select',required:true,options:opts},{name:'tipo',label:'Tipo de equipo',required:true,placeholder:'Laptop, computadora, impresora…'},{name:'marca',label:'Marca',required:true},{name:'modelo',label:'Modelo'},{name:'numeroSerie',label:'Número de serie'},{name:'descripcion',label:'Descripción',type:'textarea'}],'Guardar equipo',d=>post('/api/equipos',d))}
function newOrder(){if(!cache.clientes.length||!cache.equipos.length)return toast('Registra primero un cliente y su equipo.');openForm('Crear orden de trabajo',[{name:'clienteId',label:'Cliente',type:'select',required:true,options:cache.clientes.map(c=>({value:c.id,label:`${c.nombres} ${c.apellidos}`}))},{name:'equipoId',label:'Equipo',type:'select',required:true,options:cache.equipos.map(e=>({value:e.id,label:`${e.tipo} ${e.marca} ${e.modelo||''} · ${cache.clientes.find(c=>c.id===e.clienteId)?.nombres||''}`}))},{name:'tecnicoId',label:'Técnico asignado',type:'select',options:[{value:'',label:'Sin asignar'},...cache.tecnicos.map(t=>({value:t.id,label:t.nombre}))]},{name:'accesoriosRecibidos',label:'Accesorios recibidos'},{name:'observacionesRecepcion',label:'Observaciones',type:'textarea'}],'Crear orden',d=>post('/api/ordenes',{...d,tecnicoId:d.tecnicoId||null}))}
function newTech(){openForm('Crear cuenta de personal',[{name:'nombre',label:'Nombre completo',required:true},{name:'email',label:'Correo electrónico',type:'email',required:true},{name:'password',label:'Contraseña (mínimo 12 caracteres)',type:'password',required:true},{name:'rol',label:'Rol',type:'select',required:true,options:[{value:'TECNICO',label:'Técnico'},{value:'ADMINISTRADOR',label:'Administrador'}]}],'Crear usuario',d=>post('/api/gestion/usuarios',d))}
function newProduct(){openForm('Registrar producto',[{name:'nombre',label:'Nombre',required:true},{name:'sku',label:'SKU / código'},{name:'descripcion',label:'Descripción',type:'textarea'},{name:'categoriaId',label:'Categoría',type:'select',options:[{value:'',label:'Sin categoría'},...cache.categorias.map(c=>({value:c.id,label:c.nombre}))]},{name:'precioVenta',label:'Precio de venta (Bs)',type:'number',required:true,min:0,step:'0.01'},{name:'costo',label:'Costo (Bs)',type:'number',min:0,step:'0.01'},{name:'stockMinimo',label:'Stock mínimo',type:'number',min:0,value:'0'}],'Guardar producto',d=>post('/api/gestion/productos',{...d,categoriaId:d.categoriaId||null,costo:d.costo===''?null:Number(d.costo),precioVenta:Number(d.precioVenta),stockMinimo:Number(d.stockMinimo||0)}))}
function newCategory(){openForm('Nueva categoría',[{name:'nombre',label:'Nombre de categoría',required:true}],'Guardar categoría',d=>post('/api/gestion/categorias',d))}
function newService(){openForm('Nuevo servicio',[{name:'nombre',label:'Nombre del servicio',required:true},{name:'descripcion',label:'Descripción',type:'textarea'},{name:'categoriaId',label:'Categoría',type:'select',options:[{value:'',label:'Sin categoría'},...cache.categorias.map(c=>({value:c.id,label:c.nombre}))]},{name:'precio',label:'Precio (Bs)',type:'number',required:true,min:0,step:'0.01'}],'Guardar servicio',d=>post('/api/gestion/servicios',{...d,categoriaId:d.categoriaId||null,precio:Number(d.precio)}))}
async function clientDetail(id){try{const d=await api('/api/clientes/'+id);const c=d.cliente||d;openForm('Ficha del cliente',[{name:'nombres',label:'Nombres',value:c.nombres,required:true},{name:'apellidos',label:'Apellidos',value:c.apellidos,required:true},{name:'telefono',label:'Teléfono',value:c.telefono,required:true},{name:'email',label:'Correo',type:'email',value:c.email||''},{name:'direccion',label:'Dirección',value:c.direccion||''}],'Guardar cambios',v=>patch('/api/clientes/'+id,v))}catch(e){toast(e.message)}}
function changeStatus(id){openForm('Actualizar estado de la orden',[{name:'estado',label:'Nuevo estado',type:'select',required:true,options:Object.entries(statusLabels).map(([value,label])=>({value,label}))},{name:'observacion',label:'Observación',type:'textarea'}],'Actualizar estado',d=>patch('/api/ordenes/'+id+'/estado',d))}
async function orderDetail(id){const o=cache.ordenes.find(x=>x.id===id);if(!o)return;openForm(`Gestionar ${o.codigo}`,[{name:'accion',label:'Acción',type:'select',required:true,options:[{value:'asignar',label:'Asignar técnico'},{value:'diagnostico',label:'Registrar diagnóstico'},{value:'presupuesto',label:'Crear presupuesto'},{value:'aprobar',label:'Aprobar presupuesto (uso administrativo)'},{value:'pago',label:'Registrar pago'},{value:'estado',label:'Cambiar estado'},{value:'garantia',label:'Emitir garantía (orden entregada)'}]},{name:'tecnicoId',label:'Técnico asignado',type:'select',options:[{value:'',label:'Sin asignar'},...cache.tecnicos.map(t=>({value:t.id,label:t.nombre}))]},{name:'descripcionProblema',label:'Descripción del problema (diagnóstico)',type:'textarea'},{name:'pruebasRealizadas',label:'Pruebas realizadas',type:'textarea'},{name:'recomendacion',label:'Recomendación',type:'textarea'},{name:'subtotal',label:'Subtotal del presupuesto (Bs)',type:'number',min:0,step:'0.01'},{name:'descuento',label:'Descuento (Bs)',type:'number',min:0,step:'0.01',value:'0'},{name:'monto',label:'Monto del pago (Bs)',type:'number',min:0,step:'0.01'},{name:'metodo',label:'Método de pago',type:'select',options:['EFECTIVO','TRANSFERENCIA','QR','OTRO'].map(x=>({value:x,label:x}))},{name:'estado',label:'Nuevo estado',type:'select',options:Object.entries(statusLabels).map(([value,label])=>({value,label}))},{name:'observacion',label:'Observación del cambio',type:'textarea'},{name:'condiciones',label:'Condiciones de garantía',type:'textarea'},{name:'dias',label:'Duración de garantía (días)',type:'number',min:1,value:'30'}],'Ejecutar acción',async d=>{if(d.accion==='asignar'){if(!d.tecnicoId)throw new Error('Selecciona un técnico.');await patch(`/api/ordenes/${id}/asignacion`,{tecnicoId:d.tecnicoId})}else if(d.accion==='diagnostico'){await post(`/api/ordenes/${id}/diagnosticos`,{descripcionProblema:d.descripcionProblema,pruebasRealizadas:d.pruebasRealizadas,recomendacion:d.recomendacion})}else if(d.accion==='presupuesto'){await post('/api/gestion/presupuestos',{ordenId:id,subtotal:Number(d.subtotal),descuento:Number(d.descuento||0)})}else if(d.accion==='aprobar'){await post(`/api/gestion/ordenes/${id}/presupuesto/decision`,{decision:'APROBADO'})}else if(d.accion==='pago'){await post(`/api/gestion/ordenes/${id}/pagos`,{monto:Number(d.monto),metodo:d.metodo})}else if(d.accion==='estado'){await patch(`/api/ordenes/${id}/estado`,{estado:d.estado,observacion:d.observacion})}else if(d.accion==='garantia'){await post(`/api/gestion/ordenes/${id}/garantia`,{ordenId:id,condiciones:d.condiciones,dias:Number(d.dias||30)})}})}
function convertRequest(id,clientId){const customer=cache.clientes.find(c=>c.id===clientId);const devices=cache.equipos.filter(e=>e.clienteId===clientId);if(!devices.length)return toast(`Primero registra un equipo para ${customer?.nombres||'este cliente'}.`);openForm('Convertir solicitud en orden',[{name:'equipoId',label:'Equipo',type:'select',required:true,options:devices.map(e=>({value:e.id,label:`${e.tipo} ${e.marca} ${e.modelo||''}`}))},{name:'tecnicoId',label:'Técnico',type:'select',options:[{value:'',label:'Sin asignar'},...cache.tecnicos.map(t=>({value:t.id,label:t.nombre}))]},{name:'observacionesRecepcion',label:'Observaciones',type:'textarea'}],'Crear orden',d=>post('/api/ordenes/desde-solicitud/'+id,{...d,tecnicoId:d.tecnicoId||null}))}
async function rejectRequest(id){if(!confirm('¿Rechazar esta solicitud?'))return;try{await patch('/api/solicitudes/'+id,{estado:'RECHAZADA'});toast('Solicitud rechazada');go('solicitudes')}catch(e){toast(e.message)}}
async function toggleUser(id,activo){try{await patch('/api/gestion/usuarios/'+id+'/activo',{activo});toast('Estado de usuario actualizado');go('usuarios')}catch(e){toast(e.message)}}
function stockMove(id,name){openForm(`Movimiento de inventario · ${name}`,[{name:'tipo',label:'Tipo de movimiento',type:'select',required:true,options:['ENTRADA','SALIDA','AJUSTE'].map(x=>({value:x,label:x}))},{name:'cantidad',label:'Cantidad',type:'number',required:true,min:0,value:'1'},{name:'motivo',label:'Motivo',required:true}],'Registrar movimiento',d=>post('/api/gestion/inventario/movimientos',{...d,productoId:id,cantidad:Number(d.cantidad)}))}
(async()=>{try{const me=await api('/api/auth/me');if(me.user.rol==='ADMINISTRADOR')showApp(me.user)}catch{}})();
</script></body></html>
